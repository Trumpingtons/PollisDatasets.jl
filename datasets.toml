# Pollis Datasets: curated catalogue
#
# One [[datasets]] entry per dataset; data/<id>.csv holds the data. Fields:
#   id          name passed to dataset("..."); also the CSV file name and the DuckDB view name
#   title       display name
#   domain      grouping for docs and a future Datasets browser
#   description one or two sentences
#   rows        number of rows in data/<id>.csv
#   source      original publication or producer (cite this)
#   url         where the data was taken from
#   licence     the terms stated by the provider
#   status      open           explicit open licence (CC0, CC BY, permission granted)
#               public-domain  US-government work, or published before 1930
#               redistributed  no explicit licence; small factual table redistributed for decades in CRAN/textbook packages
#   columns     every column in file order: name and description (units, codes); missing values are empty fields
#
# Rejected after the licence check:
#   Fama-French factors   "Copyright Eugene F. Fama and Kenneth R. French", no redistribution grant (fetch live instead)
#   Sunspots (SILSO)      CC BY-NC 4.0: the non-commercial clause is incompatible with AGPL distribution
#   Boston Housing        ethically problematic variable; withdrawn from scikit-learn

# ---------- Regression ----------

[[datasets]]
id = "mtcars"
title = "Motor Trend Cars"
domain = "Regression"
description = "Fuel consumption and ten design and performance variables for 32 cars (1973-74 models)."
rows = 32
source = "Henderson, H. V. and Velleman, P. F. (1981), Building multiple regression models interactively, Biometrics 37, 391-411; data from Motor Trend (1974)"
url = "R datasets package (mtcars)"
licence = "None stated; R datasets package (GPL-2 | GPL-3)"
status = "redistributed"
columns = [
	{ name = "model", description = "Car make and model" },
	{ name = "mpg", description = "Miles per US gallon" },
	{ name = "cyl", description = "Number of cylinders" },
	{ name = "disp", description = "Displacement (cubic inches)" },
	{ name = "hp", description = "Gross horsepower" },
	{ name = "drat", description = "Rear axle ratio" },
	{ name = "wt", description = "Weight (1000 lb)" },
	{ name = "qsec", description = "Quarter-mile time (seconds)" },
	{ name = "vs", description = "Engine: 0 = V-shaped, 1 = straight" },
	{ name = "am", description = "Transmission: 0 = automatic, 1 = manual" },
	{ name = "gear", description = "Number of forward gears" },
	{ name = "carb", description = "Number of carburettors" },
]

