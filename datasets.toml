rows = 23
source = "Dalal, S. R., Fowlkes, E. B. and Hoadley, B. (1989), Risk analysis of the space shuttle: pre-Challenger prediction of failure, Journal of the American Statistical Association 84(408), 945-957, Table 1 (p. 949), doi:10.1080/01621459.1989.10478858; data from the Report of the Presidential Commission on the Space Shuttle Challenger Accident (1986), Vol. 1, pp. 129-131"
