source = "US EPA National Residential Radon Survey; Gelman, A. and Hill, J. (2007), Data Analysis Using Regression and Multilevel/Hierarchical Models"
url = "http://www.stat.columbia.edu/~gelman/arm/examples/radon/ (srrs2.dat, cty.dat)"
licence = "US government survey data"
status = "public-domain"
columns = [
	{ name = "county", description = "County name" },
	{ name = "floor", description = "Floor of the measurement: 0 = basement, 1 = first floor" },
	{ name = "activity", description = "Radon level (pCi/L)" },
	{ name = "log_radon", description = "log(activity), with 0 replaced by 0.1" },
	{ name = "log_uranium", description = "log of the county's soil uranium (ppm)" },
]

[[datasets]]
id = "sleepstudy"
title = "Sleep Deprivation Reaction Times"
domain = "Bayesian / multilevel"
description = "Reaction times of 18 subjects over ten days of sleep restriction; the classic random-slopes example."
rows = 180
source = "Belenky, G. et al. (2003), Patterns of performance degradation and restoration during sleep restriction, Journal of Sleep Research 12, 1-12"
url = "lme4 R package (sleepstudy)"
licence = "None stated; lme4 R package (GPL-2 | GPL-3)"
status = "redistributed"
columns = [
	{ name = "subject", description = "Subject identifier" },
	{ name = "days", description = "Days of sleep restriction: 0-9" },
	{ name = "reaction", description = "Average reaction time (ms)" },
]

