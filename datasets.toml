[[datasets]]
id = "challenger"
title = "Challenger O-Rings"
domain = "Count data"
description = "O-ring thermal distress (erosion and blowby) on the six field joints and the two nozzle joints of each of the 23 Space Shuttle flights before the Challenger accident, with joint temperature and leak-check pressures: Table 1 of Dalal, Fowlkes and Hoadley (1989). Challenger (flight 61-I) was launched at 31 degrees F with 200 psi field and nozzle pressures; flight 4 is absent (boosters lost at sea)."
rows = 23
source = "Dalal, S. R., Fowlkes, E. B. and Hoadley, B. (1989), Risk analysis of the space shuttle: pre-Challenger prediction of failure, Journal of the American Statistical Association 84(408), 945-957, Table 1 (p. 949), doi:10.1080/01621459.1989.10478858; data from the Report of the Presidential Commission on the Space Shuttle Challenger Accident (1986), Vol. 1, pp. 129-131"
url = "Transcribed from Table 1 of Dalal et al. (1989); column totals checked against the table's Total row"
licence = "US government work (Presidential Commission report, 1986)"
status = "public-domain"
columns = [
	{ name = "flight", description = "Flight number, as in Table 1 (e.g. 41-B)" },
	{ name = "date", description = "Launch date" },
	{ name = "temperature", description = "Joint temperature at launch (degrees F)" },
	{ name = "pressure", description = "Field-joint leak-check pressure (psi)" },
	{ name = "n_failures", description = "Field joints with primary O-ring erosion or blowby, out of 6 (Table 1, Field, Erosion or blowby)" },
	{ name = "field_erosion", description = "Field joints with primary O-ring erosion" },
	{ name = "field_erosion_secondary", description = "Field joints with secondary O-ring erosion" },
	{ name = "field_blowby", description = "Field joints with primary O-ring blowby" },
	{ name = "nozzle_pressure", description = "Nozzle-joint leak-check pressure (psi)" },
	{ name = "nozzle_failures", description = "Nozzle joints with primary O-ring erosion or blowby, out of 2, as printed in Table 1 (blank, here 0, for 51-F, 51-I and 61-A, although each shows one eroded nozzle O-ring)" },
	{ name = "nozzle_erosion", description = "Nozzle joints with primary O-ring erosion" },
	{ name = "nozzle_erosion_secondary", description = "Nozzle joints with secondary O-ring erosion" },
	{ name = "nozzle_blowby", description = "Nozzle joints with primary O-ring blowby" },
]

